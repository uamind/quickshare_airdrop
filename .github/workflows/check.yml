name: check

on: [push, pull_request]

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: |
          for f in customize.sh service.sh uninstall.sh tools/*.sh; do
            echo "== $f"; bash -n "$f"
          done
      - name: module.prop
        run: |
          for k in id name version versionCode author description; do
            grep -q "^$k=" module.prop || { echo "module.prop 缺少 $k"; exit 1; }
          done
          echo "module.prop ok"
